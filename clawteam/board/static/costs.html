<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClawTeam · Token Usage & Cost Monitor</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #08090a;
            --surface: rgba(16, 18, 22, 0.85);
            --surface-2: rgba(24, 27, 33, 0.9);
            --surface-hover: rgba(32, 36, 44, 0.95);
            --border: rgba(255, 255, 255, 0.06);
            --border-bright: rgba(255, 255, 255, 0.12);
            --text-1: #f0f2f5;
            --text-2: #8b919a;
            --text-3: #555b65;
            --mint: #34d399;
            --mint-dim: rgba(52, 211, 153, 0.12);
            --cyan: #22d3ee;
            --cyan-dim: rgba(34, 211, 238, 0.1);
            --amber: #fbbf24;
            --amber-dim: rgba(251, 191, 36, 0.1);
            --rose: #fb7185;
            --rose-dim: rgba(251, 113, 133, 0.1);
            --violet: #a78bfa;
            --violet-dim: rgba(167, 139, 250, 0.1);
            --blue: #60a5fa;
            --blue-dim: rgba(96, 165, 250, 0.1);
            --radius: 14px;
            --radius-sm: 8px;
            --mono: 'JetBrains Mono', 'SF Mono', monospace;
            --sans: 'DM Sans', -apple-system, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--sans);
            background: var(--bg);
            color: var(--text-1);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── ambient glow ── */
        .glow-bg {
            position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden;
        }
        .glow-bg .g1 {
            position: absolute; width: 600px; height: 600px; border-radius: 50%;
            background: radial-gradient(circle, rgba(52,211,153,0.08) 0%, transparent 70%);
            top: -200px; left: -100px;
            animation: drift 30s ease-in-out infinite alternate;
        }
        .glow-bg .g2 {
            position: absolute; width: 500px; height: 500px; border-radius: 50%;
            background: radial-gradient(circle, rgba(34,211,238,0.06) 0%, transparent 70%);
            bottom: -150px; right: -80px;
            animation: drift 25s ease-in-out infinite alternate-reverse;
        }
        @keyframes drift {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(60px, 40px) scale(1.15); }
        }

        /* ── top bar ── */
        .topbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 20px 40px;
            border-bottom: 1px solid var(--border);
            background: rgba(8, 9, 10, 0.7);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            position: sticky; top: 0; z-index: 50;
        }
        .topbar-left { display: flex; align-items: center; gap: 16px; }
        .topbar-brand {
            font-size: 20px; font-weight: 700; letter-spacing: -0.03em;
            background: linear-gradient(135deg, var(--mint), var(--cyan));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .topbar-sep { width: 1px; height: 24px; background: var(--border-bright); }
        .topbar-title { font-size: 15px; color: var(--text-2); font-weight: 500; }

        .topbar-right { display: flex; align-items: center; gap: 12px; }

        .team-filter {
            padding: 8px 14px; font-size: 13px; font-weight: 500; font-family: var(--sans);
            background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
            color: var(--text-1); cursor: pointer; outline: none;
            transition: border-color 0.2s;
        }
        .team-filter:hover { border-color: var(--border-bright); }
        .team-filter:focus { border-color: var(--cyan); }
        .team-filter option { background: #111318; }

        .btn-refresh {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 9px 20px; font-size: 13px; font-weight: 600; font-family: var(--sans);
            background: linear-gradient(135deg, rgba(52,211,153,0.15), rgba(34,211,238,0.15));
            border: 1px solid rgba(52,211,153,0.3); border-radius: var(--radius-sm);
            color: var(--mint); cursor: pointer; transition: all 0.25s;
            position: relative; overflow: hidden;
        }
        .btn-refresh:hover {
            background: linear-gradient(135deg, rgba(52,211,153,0.25), rgba(34,211,238,0.25));
            border-color: var(--mint);
            box-shadow: 0 0 20px rgba(52,211,153,0.15);
            transform: translateY(-1px);
        }
        .btn-refresh:active { transform: scale(0.97); }
        .btn-refresh svg { transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .btn-refresh.spinning svg { transform: rotate(360deg); }

        .btn-back {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 9px 16px; font-size: 13px; font-weight: 500; font-family: var(--sans);
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-sm); color: var(--text-2); cursor: pointer;
            text-decoration: none; transition: all 0.2s;
        }
        .btn-back:hover { color: var(--text-1); border-color: var(--border-bright); }

        /* ── main container ── */
        .container { max-width: 1400px; margin: 0 auto; padding: 32px 40px 80px; }

        /* ── last synced ── */
        .sync-bar {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 28px; font-size: 13px; color: var(--text-3);
        }
        .sync-bar .sync-dot {
            display: inline-block; width: 7px; height: 7px; border-radius: 50%;
            background: var(--mint); margin-right: 8px;
            box-shadow: 0 0 8px var(--mint);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse { 0%,100%{ opacity:1; } 50%{ opacity:0.4; } }

        /* ── hero stats ── */
        .hero-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
            margin-bottom: 32px;
        }
        @media (max-width: 900px) { .hero-grid { grid-template-columns: repeat(2,1fr); } }

        .hero-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            position: relative; overflow: hidden;
            transition: all 0.3s;
        }
        .hero-card:hover { border-color: var(--border-bright); transform: translateY(-2px); }
        .hero-card .card-icon {
            width: 36px; height: 36px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 16px; font-size: 18px;
        }
        .hero-card .card-value {
            font-size: 32px; font-weight: 700; letter-spacing: -0.03em;
            font-family: var(--mono); margin-bottom: 6px;
        }
        .hero-card .card-label {
            font-size: 13px; color: var(--text-2); font-weight: 500;
            text-transform: uppercase; letter-spacing: 0.06em;
        }
        .hero-card .card-stripe {
            position: absolute; top: 0; left: 0; right: 0; height: 3px;
        }

        .hero-card.cost .card-icon    { background: var(--mint-dim); color: var(--mint); }
        .hero-card.cost .card-value    { color: var(--mint); }
        .hero-card.cost .card-stripe   { background: linear-gradient(90deg, var(--mint), transparent); }

        .hero-card.input .card-icon    { background: var(--cyan-dim); color: var(--cyan); }
        .hero-card.input .card-value   { color: var(--cyan); }
        .hero-card.input .card-stripe  { background: linear-gradient(90deg, var(--cyan), transparent); }

        .hero-card.output .card-icon   { background: var(--amber-dim); color: var(--amber); }
        .hero-card.output .card-value  { color: var(--amber); }
        .hero-card.output .card-stripe { background: linear-gradient(90deg, var(--amber), transparent); }

        .hero-card.events .card-icon   { background: var(--violet-dim); color: var(--violet); }
        .hero-card.events .card-value  { color: var(--violet); }
        .hero-card.events .card-stripe { background: linear-gradient(90deg, var(--violet), transparent); }

        /* ── section panels ── */
        .panels-row {
            display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
            margin-bottom: 16px;
        }
        @media (max-width: 1000px) { .panels-row { grid-template-columns: 1fr; } }
        .panels-full { margin-bottom: 16px; }

        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }
        .panel-head {
            display: flex; align-items: center; justify-content: space-between;
            padding: 18px 24px;
            border-bottom: 1px solid var(--border);
        }
        .panel-head h3 {
            font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px;
        }
        .panel-head .count {
            font-size: 12px; font-weight: 600; font-family: var(--mono);
            background: rgba(255,255,255,0.06); padding: 3px 10px; border-radius: 12px;
            color: var(--text-2);
        }
        .panel-body { padding: 20px 24px; }

        /* ── bar chart ── */
        .bar-chart { display: flex; flex-direction: column; gap: 12px; }
        .bar-row { display: flex; align-items: center; gap: 12px; }
        .bar-label {
            width: 120px; font-size: 13px; font-weight: 500; color: var(--text-2);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            flex-shrink: 0;
        }
        .bar-track {
            flex: 1; height: 26px; background: rgba(255,255,255,0.03);
            border-radius: 6px; overflow: hidden; position: relative;
        }
        .bar-fill {
            height: 100%; border-radius: 6px;
            transition: width 0.8s cubic-bezier(0.33, 1, 0.68, 1);
            display: flex; align-items: center; padding-left: 10px;
            font-size: 11px; font-weight: 600; font-family: var(--mono);
            color: rgba(255,255,255,0.9); min-width: fit-content;
        }
        .bar-amount {
            font-size: 13px; font-family: var(--mono); font-weight: 600; color: var(--text-1);
            width: 80px; text-align: right; flex-shrink: 0;
        }

        /* ── timeline chart ── */
        .timeline-chart {
            display: flex; align-items: flex-end; gap: 3px;
            height: 160px; padding-top: 10px;
        }
        .tl-bar-wrap {
            flex: 1; display: flex; flex-direction: column; align-items: center;
            height: 100%; justify-content: flex-end; position: relative;
        }
        .tl-bar {
            width: 100%; min-width: 4px; border-radius: 4px 4px 0 0;
            transition: height 0.6s cubic-bezier(0.33, 1, 0.68, 1);
            position: relative; cursor: pointer;
        }
        .tl-bar:hover { filter: brightness(1.3); }
        .tl-bar .tl-tooltip {
            display: none; position: absolute; bottom: calc(100% + 8px); left: 50%;
            transform: translateX(-50%);
            background: #1a1d24; border: 1px solid var(--border-bright);
            border-radius: 8px; padding: 10px 14px;
            font-size: 11px; font-family: var(--mono); color: var(--text-1);
            white-space: nowrap; z-index: 10;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .tl-bar:hover .tl-tooltip { display: block; }
        .tl-label {
            font-size: 9px; color: var(--text-3); margin-top: 6px;
            writing-mode: vertical-lr; text-orientation: mixed;
            max-height: 50px; overflow: hidden;
        }
        .tl-granularity {
            display: flex; gap: 4px;
        }
        .tl-granularity button {
            font-family: var(--sans); font-size: 11px; font-weight: 600;
            padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border);
            background: transparent; color: var(--text-3); cursor: pointer;
            transition: all 0.2s;
        }
        .tl-granularity button.active {
            background: var(--cyan-dim); border-color: rgba(34,211,238,0.3);
            color: var(--cyan);
        }
        .tl-granularity button:hover:not(.active) { color: var(--text-2); border-color: var(--border-bright); }

        /* ── data table ── */
        .data-table {
            width: 100%; border-collapse: collapse; font-size: 13px;
        }
        .data-table th {
            text-align: left; padding: 10px 12px;
            font-size: 11px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.08em; color: var(--text-3);
            border-bottom: 1px solid var(--border);
        }
        .data-table td {
            padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.03);
            color: var(--text-2); font-family: var(--mono); font-size: 12px;
        }
        .data-table tr:hover td { background: rgba(255,255,255,0.02); color: var(--text-1); }
        .data-table .mono { font-family: var(--mono); }
        .data-table .tag {
            display: inline-block; padding: 2px 8px; border-radius: 4px;
            font-size: 11px; font-weight: 600;
        }
        .tag-agent  { background: var(--blue-dim); color: var(--blue); }
        .tag-model  { background: var(--violet-dim); color: var(--violet); }
        .tag-team   { background: var(--amber-dim); color: var(--amber); }

        /* ── empty state ── */
        .empty {
            text-align: center; padding: 48px 20px; color: var(--text-3);
        }
        .empty-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.4; }
        .empty-msg { font-size: 14px; }

        /* ── loading skeleton ── */
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.06) 50%, rgba(255,255,255,0.03) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease-in-out infinite;
            border-radius: 8px;
        }

        /* ── scrollbar ── */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

        /* ── fade in ── */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeUp 0.5s ease forwards; }
        .fade-in-d1 { animation-delay: 0.05s; opacity: 0; }
        .fade-in-d2 { animation-delay: 0.1s; opacity: 0; }
        .fade-in-d3 { animation-delay: 0.15s; opacity: 0; }
        .fade-in-d4 { animation-delay: 0.2s; opacity: 0; }
    </style>
</head>
<body>

<div class="glow-bg"><div class="g1"></div><div class="g2"></div></div>

<!-- Top Bar -->
<header class="topbar">
    <div class="topbar-left">
        <div class="topbar-brand">ClawTeam</div>
        <div class="topbar-sep"></div>
        <div class="topbar-title">Token Usage &amp; Cost Monitor</div>
    </div>
    <div class="topbar-right">
        <select id="team-filter" class="team-filter">
            <option value="">All Teams</option>
        </select>
        <button class="btn-refresh" id="btn-refresh" onclick="refreshAll()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10"></polyline>
                <polyline points="1 20 1 14 7 14"></polyline>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
            <span id="refresh-text">Refresh</span>
        </button>
        <a href="/" class="btn-back">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Board
        </a>
    </div>
</header>

<div class="container">

    <!-- Sync Bar -->
    <div class="sync-bar">
        <div><span class="sync-dot"></span><span id="sync-status">Syncing data...</span></div>
        <div id="sync-count"></div>
    </div>

    <!-- Hero Stats -->
    <div class="hero-grid" id="hero-grid">
        <div class="hero-card cost fade-in">
            <div class="card-stripe"></div>
            <div class="card-icon">$</div>
            <div class="card-value" id="h-cost">--</div>
            <div class="card-label">Total Cost</div>
        </div>
        <div class="hero-card input fade-in fade-in-d1">
            <div class="card-stripe"></div>
            <div class="card-icon">&#8594;</div>
            <div class="card-value" id="h-input">--</div>
            <div class="card-label">Input Tokens</div>
        </div>
        <div class="hero-card output fade-in fade-in-d2">
            <div class="card-stripe"></div>
            <div class="card-icon">&#8592;</div>
            <div class="card-value" id="h-output">--</div>
            <div class="card-label">Output Tokens</div>
        </div>
        <div class="hero-card events fade-in fade-in-d3">
            <div class="card-stripe"></div>
            <div class="card-icon">#</div>
            <div class="card-value" id="h-events">--</div>
            <div class="card-label">API Calls</div>
        </div>
    </div>

    <!-- Timeline -->
    <div class="panels-full fade-in fade-in-d4">
        <div class="panel">
            <div class="panel-head">
                <h3>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--cyan)" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
                    Cost Timeline
                </h3>
                <div class="tl-granularity">
                    <button class="active" onclick="setGranularity('hour',this)">Hour</button>
                    <button onclick="setGranularity('day',this)">Day</button>
                </div>
            </div>
            <div class="panel-body" id="timeline-body">
                <div class="timeline-chart" id="timeline-chart"></div>
            </div>
        </div>
    </div>

    <!-- By Agent / By Model -->
    <div class="panels-row">
        <div class="panel fade-in">
            <div class="panel-head">
                <h3>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--blue)" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                    By Agent
                </h3>
                <span class="count" id="agent-count">0</span>
            </div>
            <div class="panel-body" id="agent-body"></div>
        </div>
        <div class="panel fade-in">
            <div class="panel-head">
                <h3>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--violet)" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
                    By Model
                </h3>
                <span class="count" id="model-count">0</span>
            </div>
            <div class="panel-body" id="model-body"></div>
        </div>
    </div>

    <!-- By Team / Recent Events -->
    <div class="panels-row">
        <div class="panel fade-in">
            <div class="panel-head">
                <h3>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--amber)" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"></path><path d="M2 17l10 5 10-5"></path><path d="M2 12l10 5 10-5"></path></svg>
                    By Team
                </h3>
                <span class="count" id="team-count">0</span>
            </div>
            <div class="panel-body" id="team-body"></div>
        </div>
        <div class="panel fade-in">
            <div class="panel-head">
                <h3>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--rose)" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    Recent Events
                </h3>
                <span class="count" id="event-count">0</span>
            </div>
            <div class="panel-body" style="max-height:380px; overflow-y:auto;" id="events-body"></div>
        </div>
    </div>

</div>

<script>
const $ = id => document.getElementById(id);
let currentTeam = '';
let currentGranularity = 'hour';

const COLORS = [
    'var(--mint)', 'var(--cyan)', 'var(--amber)', 'var(--violet)',
    'var(--blue)', 'var(--rose)', '#f472b6', '#a3e635', '#fb923c', '#38bdf8'
];
const COLOR_DIMS = [
    'var(--mint-dim)', 'var(--cyan-dim)', 'var(--amber-dim)', 'var(--violet-dim)',
    'var(--blue-dim)', 'var(--rose-dim)', 'rgba(244,114,182,0.12)', 'rgba(163,230,53,0.12)',
    'rgba(251,146,60,0.12)', 'rgba(56,189,248,0.12)'
];

function fmt(n) {
    if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
    if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
    return String(n);
}

function fmtMoney(cents) {
    const dollars = cents / 100;
    if (dollars >= 1000) return '$' + (dollars / 1000).toFixed(2) + 'K';
    if (dollars >= 1) return '$' + dollars.toFixed(2);
    return cents.toFixed(2) + '¢';
}

function teamParam() {
    return currentTeam ? '?team=' + encodeURIComponent(currentTeam) : '';
}

async function fetchJson(url) {
    const res = await fetch(url);
    return res.json();
}

// ── Sync + load all data ──
async function refreshAll() {
    const btn = $('btn-refresh');
    btn.classList.add('spinning');
    $('refresh-text').textContent = 'Syncing...';

    try {
        const syncRes = await fetchJson('/api/costs/sync');
        $('sync-count').textContent = `Synced ${syncRes.total} new events`;

        await Promise.all([
            loadSummary(),
            loadTimeline(),
            loadByAgent(),
            loadByModel(),
            loadByTeam(),
            loadRecentEvents(),
        ]);
        $('sync-status').textContent = 'Last refreshed: ' + new Date().toLocaleTimeString();
    } catch (e) {
        console.error('Refresh failed', e);
        $('sync-status').textContent = 'Refresh failed — check server';
    } finally {
        setTimeout(() => {
            btn.classList.remove('spinning');
            $('refresh-text').textContent = 'Refresh';
        }, 600);
    }
}

async function loadSummary() {
    const d = await fetchJson('/api/costs/summary' + teamParam());
    $('h-cost').textContent   = fmtMoney(d.totalCostCents);
    $('h-input').textContent  = fmt(d.totalInputTokens);
    $('h-output').textContent = fmt(d.totalOutputTokens);
    $('h-events').textContent = fmt(d.eventCount);
}

async function loadTimeline() {
    const d = await fetchJson('/api/costs/timeline' + teamParam() + (teamParam() ? '&' : '?') + 'granularity=' + currentGranularity);
    const ct = $('timeline-chart');
    if (!d.length) {
        ct.innerHTML = '<div class="empty" style="width:100%;"><div class="empty-icon">📊</div><div class="empty-msg">No timeline data yet</div></div>';
        return;
    }
    const maxCost = Math.max(...d.map(x => x.costCents), 0.01);
    const maxTokens = Math.max(...d.map(x => x.inputTokens + x.outputTokens), 1);
    const show = d.slice(-60);

    ct.innerHTML = show.map((p, i) => {
        const h = Math.max(4, (p.costCents / maxCost) * 140);
        const label = currentGranularity === 'day' ? p.time.slice(5) : p.time.slice(11) + ':00';
        return `<div class="tl-bar-wrap">
            <div class="tl-bar" style="height:${h}px; background: linear-gradient(180deg, var(--cyan), rgba(34,211,238,0.3));">
                <div class="tl-tooltip">
                    <div style="margin-bottom:4px;color:var(--text-2);">${p.time}</div>
                    <div>Cost: <b style="color:var(--mint)">${fmtMoney(p.costCents)}</b></div>
                    <div>In: <b style="color:var(--cyan)">${fmt(p.inputTokens)}</b> Out: <b style="color:var(--amber)">${fmt(p.outputTokens)}</b></div>
                    <div>Calls: ${p.events}</div>
                </div>
            </div>
            ${i % Math.max(1, Math.floor(show.length / 12)) === 0 ? `<div class="tl-label">${label}</div>` : ''}
        </div>`;
    }).join('');
}

function renderBarChart(containerId, data, labelKey, valueKey, colorIdx) {
    const el = $(containerId);
    if (!data.length) {
        el.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><div class="empty-msg">No data yet</div></div>';
        return;
    }
    const max = Math.max(...data.map(r => r[valueKey]), 0.01);
    el.innerHTML = '<div class="bar-chart">' + data.map((r, i) => {
        const pct = Math.max(2, (r[valueKey] / max) * 100);
        const ci = (colorIdx + i) % COLORS.length;
        return `<div class="bar-row">
            <div class="bar-label" title="${r[labelKey]}">${r[labelKey]}</div>
            <div class="bar-track">
                <div class="bar-fill" style="width:${pct}%;background:linear-gradient(90deg,${COLORS[ci]},${COLOR_DIMS[ci]});">
                </div>
            </div>
            <div class="bar-amount">${fmtMoney(r.costCents)}</div>
        </div>`;
    }).join('') + '</div>';
}

async function loadByAgent() {
    const d = await fetchJson('/api/costs/by-agent' + teamParam());
    $('agent-count').textContent = d.length;
    renderBarChart('agent-body', d, 'agentName', 'costCents', 0);
}

async function loadByModel() {
    const d = await fetchJson('/api/costs/by-model' + teamParam());
    $('model-count').textContent = d.length;
    renderBarChart('model-body', d.map(r => ({...r, label: r.model + (r.provider ? ` (${r.provider})` : ''), costCents: r.costCents})), 'label', 'costCents', 3);
}

async function loadByTeam() {
    const d = await fetchJson('/api/costs/by-team');
    $('team-count').textContent = d.length;
    renderBarChart('team-body', d, 'teamName', 'costCents', 5);

    // populate team filter
    const sel = $('team-filter');
    const old = sel.value;
    sel.innerHTML = '<option value="">All Teams</option>' +
        d.map(t => `<option value="${t.teamName}">${t.teamName}</option>`).join('');
    sel.value = old || '';
}

async function loadRecentEvents() {
    const d = await fetchJson('/api/costs/events' + teamParam() + (teamParam() ? '&' : '?') + 'limit=30');
    $('event-count').textContent = d.length;
    const el = $('events-body');
    if (!d.length) {
        el.innerHTML = '<div class="empty"><div class="empty-icon">📋</div><div class="empty-msg">No events recorded</div></div>';
        return;
    }
    el.innerHTML = `<table class="data-table">
        <thead><tr>
            <th>Time</th><th>Agent</th><th>Model</th><th>In</th><th>Out</th><th>Cost</th>
        </tr></thead>
        <tbody>${d.map(e => `<tr>
            <td style="color:var(--text-3);font-size:11px;">${(e.reportedAt || '').slice(11, 19)}</td>
            <td><span class="tag tag-agent">${e.agentName || '-'}</span></td>
            <td><span class="tag tag-model">${e.model || '-'}</span></td>
            <td>${fmt(e.inputTokens)}</td>
            <td>${fmt(e.outputTokens)}</td>
            <td style="color:var(--mint);font-weight:600;">${fmtMoney(e.costCents)}</td>
        </tr>`).join('')}</tbody>
    </table>`;
}

function setGranularity(g, btn) {
    currentGranularity = g;
    document.querySelectorAll('.tl-granularity button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    loadTimeline();
}

$('team-filter').addEventListener('change', e => {
    currentTeam = e.target.value;
    loadSummary(); loadTimeline(); loadByAgent(); loadByModel(); loadRecentEvents();
});

// ── Init ──
refreshAll();
</script>
</body>
</html>
